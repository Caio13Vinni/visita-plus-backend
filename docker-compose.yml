# =============================================================================
# VISITA+ — Orquestração dos ambientes de desenvolvimento
# -----------------------------------------------------------------------------
# Servicos:
#   postgres -> Banco Central (online) com o esquema completo do MER
#   sqlite   -> Simulacao do banco local mobile (arquivo persistente)
#   api      -> Contêiner da API em Rust (Dockerfile multi-stage)
# =============================================================================

name: visita-plus

services:
  postgres:
    image: postgres:16-alpine
    container_name: visita_plus_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:-visita}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:-visita_forte_2026}
      POSTGRES_DB: ${POSTGRES_BANCO:-visita_plus}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORTA:-5432}:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USUARIO:-visita} -d ${POSTGRES_BANCO:-visita_plus}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - rede_visita
    restart: unless-stopped

  sqlite:
    image: alpine:3.20
    container_name: visita_plus_sqlite
    command: ["sh", "-c", "apk add --no-cache sqlite >/dev/null 2>&1; mkdir -p /dados; touch /dados/visita_plus_local.db; tail -f /dev/null"]
    volumes:
      - sqlite_dados:/dados
    networks:
      - rede_visita
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visita_plus_api
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORTA: ${API_PORTA:-8080}
      DATABASE_URL: postgres://${POSTGRES_USUARIO:-visita}:${POSTGRES_SENHA:-visita_forte_2026}@postgres:5432/${POSTGRES_BANCO:-visita_plus}
      SQLITE_ENDERECO: ${SQLITE_ENDERECO:-/dados/visita_plus_local.db}
      JWT_SEGREDO: ${JWT_SEGREDO:-troque_este_segredo_em_producao_1234567890}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS:-1440}
    ports:
      - "${API_PORTA:-8080}:8080"
    volumes:
      - sqlite_dados:/dados
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rede_visita
    restart: unless-stopped

volumes:
  postgres_dados:
    name: visita_plus_postgres_dados
  sqlite_dados:
    name: visita_plus_sqlite_dados

networks:
  rede_visita:
    name: visita_plus_rede
    driver: bridge